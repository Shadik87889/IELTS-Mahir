      async function fetchUserGameStats(userId) {
        if (!db || !userId) return;
        const appId =
          typeof __app_id !== "undefined" ? __app_id : "default-app-id";
        const userStatsDocRef = doc(
          db,
          `artifacts/${appId}/users/${userId}/gameStats/summary`,
        );

        try {
          const docSnap = await getDoc(userStatsDocRef);
          if (docSnap.exists()) {
            userGameStats = { ...userGameStats, ...docSnap.data() };
          } else {
            await setDoc(userStatsDocRef, userGameStats);
          }
        } catch (error) {
          console.error("Error fetching user game stats:", error);
        }
      }

      async function updateAuthUI(user) {
        const authButtonsContainer = document.getElementById(
          "auth-buttons-container",
        );
        if (authButtonsContainer) {
          if (user) {
            if (db && user.uid) {
              await fetchUserGameStats(user.uid);
            }

            const initial = (
              authAppState.userProfile?.name ||
              user.email ||
              user.uid
            )
              .charAt(0)
              .toUpperCase();
            const displayName =
              authAppState.userProfile?.name ||
              user.email ||
              user.uid.substring(0, 8);

            authButtonsContainer.innerHTML = `
                <div class="flex items-center gap-4 relative">
                    <div class="hidden sm:flex items-center gap-1.5 px-4 py-1.5 bg-white border border-slate-200 rounded-full shadow-sm text-sm font-bold outfit-text text-slate-700">

                                <p class="text-xs text-slate-500 mt-0.5 font-medium">Level ${
                                  userGameStats.level || 1

                            <div class="py-1">

                            </div>

                    </div>
                </div>
            `;
            const profileIconBtn = document.getElementById("profile-icon-btn");
            const profileDropdown = document.getElementById("profile-dropdown");
            const signOutDropdownBtn = document.getElementById(
              "sign-out-dropdown-btn",

            profileIconBtn.addEventListener("click", (event) => {
              event.stopPropagation();
              profileDropdown.classList.toggle("hidden");
            });
            document.addEventListener("click", (event) => {
              if (
                !profileDropdown.contains(event.target) &&
                !profileIconBtn.contains(event.target)

                profileDropdown.classList.add("hidden");
            });
            signOutDropdownBtn.addEventListener("click", async () => {
              await signOutUser();
            });

            authButtonsContainer.innerHTML = `<a href="auth" class="px-5 py-2.5 bg-slate-900 text-white rounded-full shadow-md hover:bg-slate-800 hover:shadow-lg hover:-translate-y-0.5 transition-all text-sm font-bold outfit-text tracking-wide">Join Beta</a>`;

      function renderApp() {

        const urlParams = new URLSearchParams(window.location.search);

          appDiv.innerHTML = `<div class="text-center text-rose-500 text-xl mt-12 font-bold">Error: Category not found.<br><a href="quiz-home" class="text-indigo-600 hover:underline mt-4 inline-block">Go back to modules</a></div>`;

        }

        const theme = QUIZ_THEMES[currentCategoryId] || QUIZ_THEMES["general"];
        const dynamicGridHtml = theme.gridHtml
          .replace("IMG1", theme.img1)
          .replace("IMG2", theme.img2)
          .replace("IMG3", theme.img3);
        const heroBgStyle = `background-color: ${theme.bgBase}; background-image: radial-gradient(ellipse at 50% 0%, ${theme.bgGlow} 0%, transparent 70%), linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px); background-size: 100% 100%, 36px 36px, 36px 36px; background-position: top center;`;

        const testsInThisCategory = allQuizTests.filter(
          (test) => test.categoryId === currentCategoryId,
        );

        const userIdPill =
          authAppState.isAuthReady && authAppState.userId
            ? `<div class="inline-flex items-center gap-2 px-4 py-2 mt-8 rounded-full bg-white/10 border border-white/20 backdrop-blur-md opacity-0 animate-fade-in-up" style="animation-delay: 0.3s;">
                <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                <span class="text-xs sm:text-sm font-mono text-white/80 font-medium">ID: ${authAppState.userId}</span>
             </div>`
            : "";

        appDiv.innerHTML = `
            <!-- Premium Dynamic Brand Hero Section -->
            <section class="brand-hero-section pt-8 md:pt-12 px-4 md:px-12 w-full" style="${heroBgStyle}">
                <div class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] rounded-full mix-blend-screen filter blur-[120px] opacity-30 animate-blob pointer-events-none transition-colors duration-700" style="background-color: ${

                <div class="absolute top-[20%] right-[-5%] w-[25rem] h-[25rem] rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob animation-delay-2000 pointer-events-none transition-colors duration-700" style="background-color: ${
                  theme.blob2

                <div class="max-w-7xl mx-auto relative z-10">
                    <div class="pt-2 md:pt-4 mb-4">
                        <a href="quiz-home" class="inline-flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 text-white border border-white/20 rounded-lg text-sm font-bold transition-all backdrop-blur-sm">

                        </a>
                    </div>
                    <div class="flex flex-col md:flex-row items-center justify-between gap-6 md:gap-12 pb-4 md:pb-12 mt-4">
                        
                        <div class="flex-1 md:pr-10 z-10 text-center md:text-left mt-2 md:mt-0 opacity-0 animate-fade-in-up">

                                <i class="fas fa-bolt opacity-80"></i> Challenge Yourself
                            </div>

                            <h1 class="anton-text text-5xl sm:text-6xl md:text-7xl lg:text-[5.5rem] text-white leading-[1.05] mb-4 md:mb-6 drop-shadow-xl uppercase">
                                ${category.name} <br />
                                <span class="${
                                  theme.accentText
                                } drop-shadow-md">QUIZZES</span>
                            </h1>

                            <p class="text-base sm:text-lg md:text-xl text-white/90 max-w-xl font-medium leading-relaxed mx-auto md:mx-0 shadow-sm">
                                ${category.description}
                            </p>
                            ${userIdPill}
                        </div>

                        <div class="hidden md:flex flex-1 relative justify-center items-center w-full z-10 opacity-0 animate-fade-in-up" style="animation-delay: 0.2s;">
                            ${dynamicGridHtml}
                            
                            <div class="absolute top-6 -right-6 lg:-right-10 bg-white px-5 py-3 rounded-[1.2rem] shadow-[0_20px_40px_rgba(0,0,0,0.3)] z-30 flex items-center gap-3 animate-bounce" style="animation-duration: 4.5s;">
                                <div class="w-8 h-8 ${theme.badge1Bg} ${
          theme.badge1Text
        } rounded-full flex items-center justify-center text-sm shadow-sm border ${
          theme.badge1Border
        }">

                                </div>
                                <div>

                                </div>
                            </div>

                            <div class="absolute bottom-8 -left-6 lg:-left-10 bg-white px-5 py-3 rounded-[1.2rem] shadow-[0_20px_40px_rgba(0,0,0,0.3)] z-30 flex items-center gap-3 animate-bounce" style="animation-duration: 5.5s; animation-delay: 1s;">
                                <div class="w-8 h-8 ${theme.badge2Bg} ${
          theme.badge2Text
        } rounded-full flex items-center justify-center text-sm shadow-sm border ${
          theme.badge2Border
        }">

                                </div>

                        return `<div class="md:col-span-3 text-center text-slate-600 py-8 inter-text"><p class="text-lg">No quizzes available for this category yet.</p></div>`;

                      return testsInThisCategory
                        .map((test, index) => {
                          const testLevel = test.minLevel || 1;
                          const isLocked = userGameStats.level < testLevel;

                          const cardClasses = isLocked
                            ? "video-card locked-card opacity-0 animate-fade-in-up stagger-" +
                              ((index % 4) + 1) +
                              " flex flex-col h-full outline-none"
                            : "video-card group opacity-0 animate-fade-in-up stagger-" +
                              ((index % 4) + 1) +
                              " flex flex-col h-full outline-none";

                          const linkHref = isLocked
                            ? "#"
                            : `quiz-test?category=${currentCategoryId}&test=${test.id}`;

                          const lockOverlay = isLocked
                            ? `
                              <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px] z-20 flex flex-col items-center justify-center transition-all duration-300">
                                  <div class="w-14 h-14 bg-white/95 rounded-full flex items-center justify-center text-slate-800 shadow-xl mb-2">
                                      <i class="fas fa-lock text-2xl"></i>
                                  </div>

                              </div>

                            : "";

                          const playOverlay = !isLocked
                            ? `
                              <div class="play-overlay absolute inset-0 flex items-center justify-center z-20">
                                  <div class="play-icon w-14 h-14 text-white rounded-full flex items-center justify-center backdrop-blur-md border border-white/30">
                                      <i class="fas fa-arrow-right text-xl"></i>
                                  </div>
                              </div>
                          `
                            : "";

                          return `
                                <a href="${linkHref}" class="${cardClasses}">
                                    <div class="relative overflow-hidden aspect-[16/10] bg-slate-900 border-b border-slate-100 flex items-center justify-center shrink-0">
                                        <div class="absolute inset-0 bg-gradient-to-br from-slate-800 to-slate-900 opacity-90"></div>
                                        <div class="absolute inset-0 opacity-[0.15]" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 24px 24px;"></div>

                                          theme.themeBadge
                                        } transition-transform duration-500 border border-white/20 ${
                            isLocked
                              ? ""
                              : "group-hover:scale-110 group-hover:-rotate-6"
                          }">
                                            <i class="fas ${theme.icon}"></i>

                                        ${playOverlay}

                                            theme.themeBadge

                            test.duration
                          } Mins

                                          ${test.questions.length} Qs
                                        </div>
                                    </div>
                                    
                                    <div class="p-6 md:p-7 flex flex-col flex-grow bg-white ${
                                      isLocked ? "bg-slate-50" : ""
                                    }">
                                        <h3 class="anton-text text-2xl text-slate-900 mb-3 ${
                                          isLocked
                                            ? ""
                                            : theme.themeHover ||
                                              "group-hover:text-indigo-600"
                                        } transition-colors leading-tight tracking-wide uppercase">
                                            ${test.title}
                                        </h3>
                                        <p class="text-sm text-slate-500 font-medium leading-relaxed mb-6 flex-grow">
                                            ${test.description}
                                        </p>
                                        <div class="mt-auto pt-4 border-t border-slate-200 flex items-center justify-between transition-colors ${
                                          isLocked
                                            ? ""
                                            : "group-hover:border-indigo-100"
                                        }">
                                            <span class="font-bold text-[13px] uppercase tracking-wider flex items-center ${
                                              isLocked
                                                ? "text-slate-400"
                                                : theme.themeText
                                            }">
                                                ${
                                                  isLocked
                                                    ? "Level Locked"
                                                    : "Start Quiz"
                                                }
                                            </span>
                                            <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center transition-all transform border border-slate-100 ${
                                              isLocked
                                                ? "text-slate-400"
                                                : theme.themeText +
                                                  " " +
                                                  (theme.themeBgHover ||
                                                    "group-hover:bg-indigo-600") +
                                                  " group-hover:text-white group-hover:translate-x-1 group-hover:border-transparent"
                                            }">
                                                <i class="fas ${
                                                  isLocked
                                                    ? "fa-lock"
                                                    : "fa-chevron-right"
                                                } text-xs"></i>
                                            </div>
                                        </div>
                                    </div>
                                </a>
                            `;
                        })
                        .join("");
                    })()}
                </div>
            </main>
        `;
      }

      window.onload = async function () {
        initFirebaseAuth(updateAuthUI)
          .then(async ({ db: firestoreDb, auth: firebaseAuth }) => {
            db = firestoreDb;
            auth = firebaseAuth;
            auth.onAuthStateChanged(async (user) => {
              if (user) await fetchUserGameStats(user.uid);
              renderApp();
            });
          })
          .catch((error) => {
            console.error("Failed to init Firebase:", error);
            showToast(
              "Initialization error. Some features may not work.",
              "error",
            );
            renderApp();
          });
      };
    </script>
  </body>
</html>
