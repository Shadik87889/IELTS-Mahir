                    ) {
                      const userAnswer = testState.userAnswers[question.id];
                      const correctAnswer = question.correctAnswer;
                      let isCorrect = false;

                      if (userAnswer && correctAnswer) {
                        if (Array.isArray(correctAnswer)) {
                          // If correctAnswer is an array, check if userAnswer is one of the valid answers
                          isCorrect = correctAnswer.some(
                            (ans) =>
                              ans.toLowerCase() === userAnswer.toLowerCase(),
                          );
                        } else {
                          // Otherwise, do a direct string comparison
                          isCorrect =
                            userAnswer.toLowerCase() ===
                            correctAnswer.toLowerCase();
                        }
                      }

                      if (isCorrect) {
                        correctAnswersCount++;
                      }
                    } else if (question.type === "flow_chart") {
                      correctAnswersCount += scoreFlowChartQuestion(

                    } else if (question.type === "table_fill_in_the_blank") {
                      if (question.correctAnswer) {

                          const userAnswer =
                            testState.userAnswers[subQuestionId];

                            question.correctAnswer[subQuestionId];
                          let isCorrect = false;
                          if (userAnswer && correctAnswer) {
                            if (Array.isArray(correctAnswer)) {
                              isCorrect = correctAnswer.some(
                                (ans) =>
                                  ans.toLowerCase() ===
                                  userAnswer.toLowerCase(),

                            } else {

                                userAnswer.toLowerCase() ===

                            }
                          }
                          if (isCorrect) {
                            correctAnswersCount++;
                          }
                        }
                      }
                    }
                  });
                }
              }
            });
          });
          bandScore = calculateIELTSBandScore(
            correctAnswersCount,

        renderApp(); // Re-render the app to show results

                                              ? userAnsArr.sort().join(", ")

                                            correctAnsArr.length;

                                          if (
                                            numberCorrect === totalCorrect &&
                                            userAnsArr.length === totalCorrect
                                          ) {
                                            resultClass =
                                              "border-green-300 bg-green-50"; // Fully correct

                                            // Use a yellow/orange color for partial correctness

                                                  " / ",

                                                subIsCorrect = subCorrectAnswer.some(
                                                  (ans) =>
                                                    ans.toLowerCase() ===
                                                    subUserAnswer.toLowerCase(),

                                              ) {

                                                if (question.correctAnswer) {

                                                    question.correctAnswer,
                                                  )
                                                    .map((subQuestionId) => {
                                                      const subUserAnswer =
                                                        userAnswers[
                                                          subQuestionId
                                                        ] || "Unattempted";
                                                      const subCorrectAnswer =
                                                        question.correctAnswer[
                                                          subQuestionId
                                                        ];

                                                      let subCorrectAnswerDisplay =
                                                        "";
                                                      let subIsCorrect = false;
                                                      if (
                                                        Array.isArray(
                                                          subCorrectAnswer,
                                                        )
                                                      ) {
                                                        subCorrectAnswerDisplay = subCorrectAnswer.join(
                                                          " / ",
                                                        );
                                                        subIsCorrect = subCorrectAnswer.some(
                                                          (ans) =>
                                                            ans.toLowerCase() ===
                                                            subUserAnswer.toLowerCase(),
                                                        );
                                                      } else {
                                                        subCorrectAnswerDisplay = subCorrectAnswer;
                                                        subIsCorrect =
                                                          subUserAnswer.toLowerCase() ===
                                                          subCorrectAnswerDisplay.toLowerCase();
                                                      }

                                                      const displayQuestionNumber = subQuestionId.replace(
                                                        "q",
                                                        "",
                                                      );
                                                      let originalCellContent =
                                                        "";
                                                      // Attempt to reconstruct original cell content for display
                                                      if (question.tableData) {
                                                        question.tableData.forEach(
                                                          (row) => {
                                                            row.forEach(
                                                              (cell) => {
                                                                if (
                                                                  cell.includes(
                                                                    `${displayQuestionNumber}. [INPUT]`,
                                                                  )
                                                                ) {
                                                                  originalCellContent = cell.replace(
                                                                    /\[INPUT\]/,
                                                                    "...",
                                                                  );
                                                                }
                                                              },
                                                            );
                                                          },
                                                        );
                                                      }

                                                      return `
                                                            <div class="p-4 rounded-lg border ${
                                                              subIsCorrect
                                                                ? "border-green-300 bg-green-50"
                                                                : "border-red-300 bg-red-50"
                                                            }">
                                                                <p class="font-semibold text-gray-900 mb-2">
                                                                    Question ${displayQuestionNumber}: ${
                                                        originalCellContent ||
                                                        `Table Question ${displayQuestionNumber}`
                                                      }
                                                                </p>
                                                                <p class="text-sm text-gray-700">
                                                                    Your Answer: <span class="${
                                                                      subIsCorrect
                                                                        ? "correct-answer"
                                                                        : "incorrect-answer"
                                                                    }">${subUserAnswer}</span>
                                                                </p>
                                                                <p class="text-sm text-gray-700">
                                                                    Correct Answer: <span class="correct-answer">${subCorrectAnswerDisplay}</span>
                                                                </p>
                                                                ${
                                                                  question.explanation
                                                                    ? `<div class="explanation"><strong>Explanation:</strong> ${question.explanation}</div>`
                                                                    : ""
                                                                }
                                                            </div>
                                                        `;
                                                    })
                                                    .join("");
                                                }
                                              } else {
                                                // Fallback for any truly unhandled question types
                                                console.warn(
                                                  "Unhandled question type in feedback rendering:",
                                                  question.type,
                                                  question,
                                                );
                                                questionTextForDisplay = `Question ${
                                                  question.questionNumber ||
                                                  "N/A"
                                                }: (Type: ${
                                                  question.type || "unknown"
                                                })`;
                                              }

                                              return `
                                                <div class="p-4 rounded-lg border ${
                                                  isCorrect
                                                    ? "border-green-300 bg-green-50"
                                                    : "border-red-300 bg-red-50"
                                                }">

                                                        Question ${
                                                          question.questionNumber
                                                        }: ${questionTextForDisplay}
                                                    </p>
                                                    <p class="text-sm text-gray-700">
                                                        Your Answer: <span class="${
                                                          isCorrect
                                                            ? "correct-answer"
                                                            : "incorrect-answer"
                                                        }">${userAnswerDisplay}</span>
                                                    </p>
                                                    <p class="text-sm text-gray-700">
                                                        Correct Answer: <span class="correct-answer">${correctAnswerDisplay}</span>
                                                    </p>
                                                    ${
                                                      question.explanation
                                                        ? `<div class="explanation">
                                                            <strong>Explanation:</strong> ${question.explanation}
                                                        </div>`
                                                        : ""
                                                    }
                                                </div>
                                            `;
                                            })
                                            .join("");
                                        }
                                      }
                                      return groupReviewHtml;
                                    })
                                    .join("");
                                }
                              })
                              .join("")}
                        </div>

      /**
       * Navigates to the next section of the test (for Reading/Writing).
       */
      function goToNextSection() {
        // Save current passage state before navigating
        updateCurrentPassageState();

        if (testState.currentSectionIndex < currentTest.sections.length - 1) {
          testState.currentSectionIndex++;
          saveDraftState();
          renderApp();
          // Scroll to the top of the main content area for the new section
          document.querySelector(".main-test-content").scrollTop = 0;
          if (currentModuleId === "reading") {
            document.querySelector(".passage-content-area").scrollTop = 0;
          } else if (currentModuleId === "writing") {
            document.querySelector(".writing-instructions-area").scrollTop = 0;
          }
        }
      }

      /**
       * Navigates to the previous section of the test (for Reading/Writing).
       */
      function goToPreviousSection() {
        // Save current passage state before navigating
        updateCurrentPassageState();

        if (testState.currentSectionIndex > 0) {
          testState.currentSectionIndex--;
          saveDraftState();
          renderApp();
          // Scroll to the top of the main content area for the new section
          document.querySelector(".main-test-content").scrollTop = 0;
          if (currentModuleId === "reading") {
            document.querySelector(".passage-content-area").scrollTop = 0;
          } else if (currentModuleId === "writing") {
            document.querySelector(".writing-instructions-area").scrollTop = 0;
          }
        }
      }

<!-- Test Sections and Questions -->

        // --- START: Highlight & Note Interaction Logic (Global for Test Area) ---
        const testLayoutArea = appDiv.querySelector(".mock-test-layout");
        if (testLayoutArea) {
          // Listen for text selection anywhere in the layout (passage AND questions)
          testLayoutArea.addEventListener("mouseup", handlePassageMouseUp);
          testLayoutArea.addEventListener("touchend", handlePassageMouseUp); // For mobile

          // Listen for clicks on notes & highlights
          testLayoutArea.addEventListener("click", (event) => {
            if (
              event.target.classList.contains("note-text") &&
              event.target.id
            ) {
              const noteText = highlightState.notes[event.target.id];
              if (noteText) {
                showNote(noteText);
              }
            } else if (event.target.classList.contains("highlighted-text")) {
              // Feature: Click a highlight to easily select it so you can click "Clear"
              const selection = window.getSelection();
              const range = document.createRange();
              range.selectNodeContents(event.target);
              selection.removeAllRanges();
              selection.addRange(range);
              highlightState.currentSelection = range;
              showSelectionPopover(range);
            }
          });
        }
        // --- END: Highlight & Note Interaction Logic ---

        // --- START: Resize Logic ---
        if (currentModuleId === "reading" && isDesktop) {
          const resizer = document.getElementById("reading-resizer");
          const layoutContainer = appDiv.querySelector(
            ".mock-test-layout.reading-layout",

          if (resizer && layoutContainer) {
            resizer.addEventListener("mousedown", (e) => {
              isResizing = true;
              currentResizer = resizer;
              readingLayoutContainer = layoutContainer;
              resizer.classList.add("dragging");
              layoutContainer.classList.add("is-resizing");

        // Helper function to render writing instructions
        function renderWritingInstructions(task) {
          return `

                        ${task.instructions}
                    </div>
                </div>
            `;
        }

        // Helper function to render writing tasks (response input area)
        function renderWritingTask(task) {
          const userAnswerText = testState.userAnswers[task.id] || "";
          const currentWordCount = calculateWordCount(userAnswerText);
          const meetsMinWordCount = currentWordCount >= task.wordCountMin;

          return `
                <div class="question-section" id="task-response-${task.id}">
                    <h3 class="text-2xl font-heading text-gray-700 mb-3">Your Response</h3>
                    <div class="question-item">
                        
                        <textarea id="writing-response-${task.id}"

                                  rows="15"
                                  placeholder="Start writing your answer here..."
                                  oninput="handleAnswerInput('${
                                    task.id
                                  }', this.value)">${userAnswerText}</textarea>
                        <div class="text-right text-sm mt-2">
                            Word Count: <span id="word-count-${
                              task.id
                            }" class="${
            meetsMinWordCount ? "text-green-600" : "text-red-600"
          } font-bold">${currentWordCount}</span> / Min: ${
            task.wordCountMin
          } words
                        </div>
                    </div>
                </div>
            `;
        }

        // Helper function to render question groups (existing for Listening/Reading)
        function qGroupRenderer(section) {
          return section.questionGroups
            .map((qGroup) => {
              let questionsHtml = "";

                var optionsBoxTitle =
                  qGroup.matchingOptions.title || "Problems";
                var optionsListHtml = Object.entries(qGroup.matchingOptions)
                  .filter(function (entry) {
                    return entry[0] !== "title";
                  })
                  .map(function (entry) {
                    return (
                      '<div class="text-[16px] text-gray-800 mb-1 leading-relaxed">' +
                      entry[0] +
                      ". " +
                      entry[1] +
                      "</div>"
                    );
                  })
                  .join("");

                var optionsBoxHtml =
                  '<div class="border border-gray-600 p-6 mb-8 max-w-[500px] mx-auto bg-white mt-4">' +

                  optionsBoxTitle +
                  "</h4>" +
                  "<div>" +
                  optionsListHtml +
                  "</div>" +
                  "</div>";

                var questionsListHtml = qGroup.matchingItems
                  .map(function (item) {
                    var questionId = "q" + item.number;
                    var selectedVal = testState.userAnswers[questionId] || "";

                      .filter(function (k) {
                        return k !== "title";
                      })
                      .map(function (key) {
                        var sel = selectedVal === key ? "selected" : "";
                        return (
                          '<option value="' +
                          key +
                          '" ' +
                          sel +
                          ">" +
                          key +
                          "</option>"
                        );
                      })
                      .join("");

                      '<div class="flex items-center gap-4 mb-4" id="question-' +
                      item.number +
                      '">' +
                      '<strong class="text-black text-[16px] w-[24px] text-right">' +
                      item.number +
                      "</strong>" +
                      '<span class="text-[16px] text-black min-w-[150px] flex-1">' +
                      item.text +
                      "</span>" +
                      '<select id="' +
                      questionId +
                      '" onchange="handleAnswerInput(\'' +
                      questionId +
                      '\', this.value)" class="border border-gray-300 rounded px-2 py-1.5 w-[65px] bg-white text-gray-700 focus:outline-none focus:border-black focus:ring-1 focus:ring-black appearance-none bg-no-repeat cursor-pointer" style="background-image: url(\'data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%22%20fill%3D%22none%22%20stroke%3D%22%23999%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E\'); background-position: right 6px center; background-size: 14px;">' +

                      optionsHtml +

                      "</div>"
                    );

                  .join("");

                  '<div class="w-full">' +
                  optionsBoxHtml +
                  '<div class="max-w-[500px] mx-auto flex flex-col justify-start">' +
                  questionsListHtml +
                  "</div></div>";
              } else if (qGroup.type === "matching_headings") {

                          </div>

                if (qGroup.questions && qGroup.questions.length > 0) {

                      data.sourceQuestion !== targetQuestionNumber
                    ) {
                      clearMatchingAnswer(data.sourceQuestion);
                    }
                    handleMatchingAnswer(targetQuestionNumber, data.optionId);
                  } catch (err) {
                    console.error("Error processing drop event:", err);
                  }
                });
              });

              const optionsBox = matchingContainer.querySelector(
                ".matching-options-box",
              );
              if (optionsBox) {
                optionsBox.addEventListener("dragover", (e) => {
                  e.preventDefault();
                  optionsBox.classList.add("drag-over-clear");
                });
                optionsBox.addEventListener("dragleave", (e) => {
                  optionsBox.classList.remove("drag-over-clear");
                });
                optionsBox.addEventListener("drop", (e) => {
                  e.preventDefault();
                  optionsBox.classList.remove("drag-over-clear");
                  try {
                    const data = JSON.parse(
                      e.dataTransfer.getData("application/json"),
                    );
                    if (data.sourceQuestion) {
                      clearMatchingAnswer(data.sourceQuestion);
                    }
                  } catch (err) {
                    console.error("Error processing drop event:", err);
                  }
                });
              }
            });
          }

          // Populate question palette (both desktop and mobile) if listening or reading test
          if (
            currentModuleId === "listening" ||
            currentModuleId === "reading"
          ) {
            const questionPaletteDesktop = document.getElementById(
              "question-palette-desktop",
            );
            const questionPaletteMobile = document.getElementById(
              "question-palette-mobile",
            );
            const questionPaletteJumpinto = document.getElementById(
              "question-palette-jumpinto",
            );
            const desktopTimerDisplaySidebar = document.getElementById(
              "timer-display-desktop-sidebar",
            );

            // Populate Jumpinto palette
            if (questionPaletteJumpinto) {
              let jumpintoHtml = "";
              let currentPart = 1;
              const partLabel =
                currentModuleId === "reading" ? "Passage" : "Part";

              // Usually 40 questions in IELTS
              for (let i = 1; i <= totalQuestions; i++) {
                if (currentModuleId === "reading") {
                  if (i === 1 || i === 14 || i === 27) {
                    jumpintoHtml += `<span class="jumpinto-part-label">${partLabel} ${currentPart}</span>`;
                    currentPart++;
                  }
                } else {
                  if (i === 1 || i === 11 || i === 21 || i === 31) {
                    jumpintoHtml += `<span class="jumpinto-part-label">${partLabel} ${currentPart}</span>`;
                    currentPart++;
                  }
                }

                const item = questionPaletteItems.find(
                  (q) => q.paletteNumber === i,
                );
                if (item) {
                  jumpintoHtml += `<button class="jumpinto-q-btn unanswered" data-palette-number="${item.paletteNumber}">${item.paletteNumber}</button>`;
                } else {
                  jumpintoHtml += `<button class="jumpinto-q-btn unanswered" data-palette-number="${i}">${i}</button>`;
                }
              }
              questionPaletteJumpinto.innerHTML = jumpintoHtml;

              questionPaletteJumpinto.addEventListener("click", (event) => {
                if (event.target.classList.contains("jumpinto-q-btn")) {
                  const paletteNum = parseInt(
                    event.target.dataset.paletteNumber,
                  );
                  scrollToQuestion(paletteNum);
                }
              });
            }

            // Update sidebar timer display
            if (desktopTimerDisplaySidebar) {
              desktopTimerDisplaySidebar.textContent = formatTime(
                testState.timeLeft,
              );
            }

            // 1. Generate Mobile Palette (Classic Grid - keeps mobile UI unaffected)
            const mobilePaletteHtml = questionPaletteItems
              .map((item) => {
                return `<button class="question-palette-btn unanswered" data-palette-number="${item.paletteNumber}">${item.paletteNumber}</button>`;
              })
              .join("");

            if (questionPaletteMobile) {
              questionPaletteMobile.innerHTML = mobilePaletteHtml;
              questionPaletteMobile.addEventListener("click", (event) => {
                if (event.target.classList.contains("question-palette-btn")) {
                  const paletteNum = parseInt(
                    event.target.dataset.paletteNumber,
                  );
                  scrollToQuestion(paletteNum);
                  // Collapse the palette after clicking a question on mobile
                  const mobilePaletteWrapper = document.getElementById(
                    "mobile-question-palette-wrapper",
                  );
                  const paletteToggleIcon = document.getElementById(
                    "palette-toggle-icon",
                  );

                  if (mobilePaletteWrapper.classList.contains("expanded")) {
                    mobilePaletteWrapper.classList.remove("expanded");
                    paletteToggleIcon.classList.remove("ph-caret-up");
                    paletteToggleIcon.classList.add("ph-caret-down");
                  }
                }
              });
            }

            // Mobile palette dropdown logic
            const mobilePaletteHeader = document.getElementById(
              "mobile-palette-header",
            );
            const mobilePaletteContent = document.getElementById(
              "mobile-palette-content",
            );
            const paletteToggleIcon = document.getElementById(
              "palette-toggle-icon",
            );

            if (
              mobilePaletteHeader &&
              mobilePaletteContent &&
              paletteToggleIcon &&
              mobilePaletteWrapper
            ) {
              mobilePaletteHeader.addEventListener("click", () => {
                const isExpanded = mobilePaletteWrapper.classList.toggle(
                  "expanded",
                ); // Corrected: toggle on wrapper
                if (isExpanded) {
                  paletteToggleIcon.classList.remove("ph-caret-down");
                  paletteToggleIcon.classList.add("ph-caret-up");
                } else {
                  paletteToggleIcon.classList.remove("ph-caret-up");
                  paletteToggleIcon.classList.add("ph-caret-down");
                }
              });
            }

            updateQuestionPalette(); // Initial update of palette state
            if (totalQuestions > 0) {
              scrollToQuestion(testState.currentQuestionIndex + 1); // Scroll to current question
            }
          }

          // Attach listener to new Section Tabs (Listening & Reading)
          const sectionTabsContainer = document.getElementById(
            "test-section-tabs",
          );
          if (sectionTabsContainer) {
            sectionTabsContainer.addEventListener("click", (event) => {
              const btn = event.target.closest(".section-tab-btn");
              if (btn) {
                const targetIndex = parseInt(btn.dataset.sectionIndex);
                if (targetIndex !== testState.currentSectionIndex) {
                  testState.currentSectionIndex = targetIndex;
                  saveDraftState();
                  renderApp();
                  document.querySelector(".main-test-content").scrollTop = 0;
                  if (currentModuleId === "reading") {
                    document.querySelector(
                      ".passage-content-area",
                    ).scrollTop = 0;
                  }
                }
              }
            });
          }

          // Navigation buttons logic for ALL modules
          const prevSectionBtn = document.getElementById("prev-section-btn");
          const nextSectionBtn = document.getElementById("next-section-btn");

          if (prevSectionBtn) {
            prevSectionBtn.onclick = goToPreviousSection;
          }
          if (nextSectionBtn) {
            nextSectionBtn.onclick = goToNextSection;
          }

          if (currentModuleId === "reading" || currentModuleId === "writing") {
            // Mobile reading tabs event listeners (only for reading)
            if (currentModuleId === "reading") {
              const passageTabBtn = document.getElementById("passage-tab-btn");
              const questionsTabBtn = document.getElementById(
                "questions-tab-btn",
              );

              if (passageTabBtn) {
                passageTabBtn.onclick = () => setActiveReadingTab("passage");
              }
              if (questionsTabBtn) {
                questionsTabBtn.onclick = () =>
                  setActiveReadingTab("questions");
              }
            }
            // Mobile writing tabs event listeners (only for writing)
            if (currentModuleId === "writing") {
              const instructionsTabBtn = document.getElementById(
                "instructions-tab-btn",
              );
              const responseTabBtn = document.getElementById(
                "response-tab-btn",
              );

              if (instructionsTabBtn) {
                instructionsTabBtn.onclick = () =>
                  setActiveWritingTab("instructions");
              }
              if (responseTabBtn) {
                responseTabBtn.onclick = () => setActiveWritingTab("response");
              }
            }
          }

          // Submit button common logic abstraction
          const handleSubmissionPrompt = () => {
            let unansweredCount = 0;
            if (currentModuleId === "writing") {
              currentTest.sections.forEach((task) => {
                const userAnswerText = testState.userAnswers[task.id] || "";
                const wordCount = calculateWordCount(userAnswerText);
                if (wordCount < task.wordCountMin) {
                  unansweredCount++;
                }
              });
              showModal(
                "Confirm Submission",
                `Are you sure you want to submit the test? ${
                  unansweredCount > 0
                    ? `You have ${unansweredCount} writing tasks below the minimum word count.`
                    : "All writing tasks meet the minimum word count."
                }`,
                true,
                () => handleSubmitTest(),
                () => hideModal(),
              );
            } else {
              const processedMultiAnswerIds = new Set();
              questionPaletteItems.forEach((item) => {
                if (item.isMultiAnswerPart) {
                  if (!processedMultiAnswerIds.has(item.questionId)) {
                    const userAnswer = testState.userAnswers[item.questionId];
                    const answeredCount = Array.isArray(userAnswer)
                      ? userAnswer.length
                      : 0;
                    const requiredCount = item.requiredAnswers || 0;
                    const remaining = requiredCount - answeredCount;
                    if (remaining > 0) {
                      unansweredCount += remaining;
                    }
                    processedMultiAnswerIds.add(item.questionId);
                  }
                } else {
                  const userAnswer = testState.userAnswers[item.questionId];
                  if (
                    userAnswer === undefined ||
                    userAnswer === null ||
                    userAnswer === "" ||
                    (Array.isArray(userAnswer) && userAnswer.length === 0)
                  ) {
                    unansweredCount++;
                  }
                }
              });

              showModal(
                "Confirm Submission",
                `Are you sure you want to submit the test? You have ${unansweredCount} unanswered questions.`,
                true,
                () => handleSubmitTest(),
                () => hideModal(),
              );
            }
          };

          const submitBtn = document.getElementById("submit-test-btn");
          if (submitBtn)
            submitBtn.addEventListener("click", handleSubmissionPrompt);

          const headerSubmitBtn = document.getElementById("header-submit-btn");
          if (headerSubmitBtn)
            headerSubmitBtn.addEventListener("click", handleSubmissionPrompt);

          // Start the timer
          startTimer();
        }
      }

      // Expose functions to global scope for oninput/onchange attributes
      window.handleAnswerInput = handleAnswerInput;
      window.handleMatchingAnswer = handleMatchingAnswer;
      window.setActiveReadingTab = setActiveReadingTab; // Expose for tab buttons
      window.setActiveWritingTab = setActiveWritingTab; // Expose for tab buttons

      // Initialization Logic
      window.onload = async function () {
        // --- START: Dynamic creation of highlighter UI elements ---
        const highlighterStyles = `
            .highlighted-text { background-color: #fffb8f; border-radius: 3px; padding: 1px 0; }
            .note-text { background-color: #a7e1ff; border-radius: 3px; padding: 1px 0; cursor: pointer; border-bottom: 2px dotted #005a8d; }
            #selection-popover { 
                position: absolute; 
                background-color: #333; 
                color: white; 
                padding: 5px 10px; 
                border-radius: 8px; 
                box-shadow: 0 4px 8px rgba(0,0,0,0.2); 
                z-index: 1000; 
                display: flex; 
                gap: 10px; 
                transition: opacity 0.1s ease-in-out;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
            #selection-popover.visible {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
            }
            #selection-popover button { background: none; border: none; color: white; cursor: pointer; font-size: 14px; padding: 5px; }
            #selection-popover button:hover { color: #a7e1ff; }
            #note-modal-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1001; }
            #note-modal-container.hidden { display: none; }
            #note-modal-content { background-color: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
            #note-modal-content h3 { margin-top: 0; font-size: 1.25rem; font-weight: bold; color: #333; }
            #note-textarea { width: 100%; margin-top: 10px; border: 1px solid #ccc; border-radius: 8px; padding: 10px; font-family: inherit; resize: vertical; }
            #note-modal-buttons { margin-top: 15px; text-align: right; display: flex; gap: 10px; justify-content: flex-end; }
            #note-modal-buttons button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
            #save-note-btn { background-color: #2563eb; color: white; }
            #cancel-note-btn { background-color: #e5e7eb; color: #374151; }
        `;
        const styleSheet = document.createElement("style");
        styleSheet.innerText = highlighterStyles;
        document.head.appendChild(styleSheet);

        const popover = document.createElement("div");
        popover.id = "selection-popover";
        popover.innerHTML = `
            <button id="highlight-btn" title="Highlight selection" class="flex items-center gap-1"><i class="fas fa-highlighter"></i> Highlight</button>
            <button id="add-note-btn" title="Add note to selection" class="flex items-center gap-1"><i class="fas fa-sticky-note"></i> Note</button>
            <button id="clear-highlight-btn" title="Clear selection highlight" class="flex items-center gap-1 text-red-400 hover:text-red-300"><i class="fas fa-eraser"></i> Clear</button>
        `;
        document.body.appendChild(popover);

        const noteModal = document.createElement("div");
        noteModal.id = "note-modal-container";
        noteModal.className = "hidden";
        noteModal.innerHTML = `
            <div id="note-modal-content" onclick="event.stopPropagation();">
                <h3>Add a Note</h3>
                <textarea id="note-textarea" rows="4" placeholder="Type your note here..."></textarea>
                <div id="note-modal-buttons">
                    <button id="cancel-note-btn">Cancel</button>
                    <button id="save-note-btn">Save</button>
                </div>
            </div>
        `;
        document.body.appendChild(noteModal);

        // Add event listeners for highlighter UI
        document
          .getElementById("highlight-btn")
          .addEventListener("click", () => {
            applyHighlight("highlight");
            hideSelectionPopover();
          });
        document
          .getElementById("add-note-btn")
          .addEventListener("click", () => {
            showNoteModal();
            hideSelectionPopover();
          });
        document
          .getElementById("save-note-btn")
          .addEventListener("click", saveNote);
        document
          .getElementById("cancel-note-btn")
          .addEventListener("click", hideNoteModal);
        document
          .getElementById("note-modal-container")
          .addEventListener("click", hideNoteModal); // Close on overlay click

        // Add event listener for Clear Highlight
        document
          .getElementById("clear-highlight-btn")
          .addEventListener("click", () => {
            if (highlightState.currentSelection) {
              const range = highlightState.currentSelection;
              const spans = document.querySelectorAll(
                ".highlighted-text, .note-text",
              );
              spans.forEach((span) => {
                // Check if the selected text overlaps with any highlighted spans
                if (range.intersectsNode(span)) {
                  const parent = span.parentNode;
                  while (span.firstChild) {
                    parent.insertBefore(span.firstChild, span);
                  }
                  parent.removeChild(span);
                  // Delete note data if it was a note
                  if (highlightState.notes[span.id]) {
                    delete highlightState.notes[span.id];
                  }
                }
              });
              window.getSelection().removeAllRanges();
              hideSelectionPopover();
              updateCurrentPassageState(); // Save state
              saveDraftState();
            }
          });
        // --- END: Dynamic creation of highlighter UI elements ---

        // Initialize Firebase Auth and listen for state changes
        initFirebaseAuth(updateAuthUI)
          .then(async ({ db: firestoreDb, auth: firebaseAuth }) => {
            db = firestoreDb;
            auth = firebaseAuth;
            console.log("Firebase initialized in mock-test:", {
              db,
              auth,
            });

            // Parse URL parameters for initial load (e.g., if user refreshes results page)
            const urlParams = new URLSearchParams(window.location.search);
            currentModuleId = urlParams.get("module");
            currentTestId = urlParams.get("test");

            if (currentModuleId && currentTestId) {
              currentTest = allMockTests.find(
                (test) =>
                  test.moduleId === currentModuleId &&
                  test.id === currentTestId,
              );

              if (currentTest) {
                // Determine if the test is premium
                const moduleTests = allMockTests.filter(
                  (t) => t.moduleId === currentModuleId,
                );
                const testIndex = moduleTests.findIndex(
                  (t) => t.id === currentTestId,
                );
                // Premium logic starting from index 1 (Only the first test is free)
                testState.isPremiumTest =
                  (currentModuleId === "reading" ||
                    currentModuleId === "listening" ||
                    currentModuleId === "writing") &&
                  testIndex >= 1;

                const scoreParam = urlParams.get("score");
                const totalParam = urlParams.get("total");
                const bandParam = urlParams.get("band");
                const timeParam = urlParams.get("time");

                if (
                  scoreParam !== null &&
                  totalParam !== null &&
                  bandParam !== null &&
                  timeParam !== null
                ) {
                  // This means we are loading a completed test's results directly
                  testState.testCompleted = true;
                  testState.isLoadingResults = true; // Set loading state for results
                  testState.isCheckingAuth = false; // Not checking auth for direct results viewing

                  // Fetch the actual user result document to get userAnswers
                  auth.onAuthStateChanged(async (user) => {
                    if (authAppState.userId) {
                      testState.userResultDoc = await fetchUserMockTestResult(
                        authAppState.userId,
                        currentTestId,
                      );
                    } else {
                      console.warn(
                        "User not authenticated, cannot fetch specific user result for display.",
                      );
                      testState.userResultDoc = {
                        testTitle: currentTest.title,
                        correctAnswers: parseInt(scoreParam),
                        totalQuestions: parseInt(totalParam),
                        bandScore: parseFloat(bandParam),
                        timeTakenSeconds: parseInt(timeParam),
                        userAnswers: {}, // Fallback empty answers
                      };
                    }
                    await fetchLeaderboard();
                    testState.isLoadingResults = false;
                    renderApp(); // Render results UI
                  });
                } else {
                  // Not a completed test, initialize for a new test
                  // Set loading state to verify premium access
                  testState.isCheckingAuth = true;
                  renderApp(); // Show "Verifying access..." spinner

                  let isTestInitialized = false;

                  auth.onAuthStateChanged(async (user) => {
                    if (user) {
                      // Fetch premium granted date to handle retakes correctly
                      await fetchPremiumDetails(user.uid);

                      const appId =
                        typeof __app_id !== "undefined"
                          ? __app_id
                          : "ielts-mahir-community-forum";
                      const userStatsDocRef = doc(
                        db,
                        `artifacts/${appId}/users/${user.uid}/gameStats/summary`,
                      );
                      try {
                        const docSnap = await getDoc(userStatsDocRef);
                        if (docSnap.exists()) {
                          const data = docSnap.data();
                          if (data.isPremium === true) {
                            testState.isUserPremium = true;
                            testState.premiumPackage =
                              data.premiumPackage || "";
                          } else {
                            testState.isUserPremium = false;
                            testState.premiumPackage = "";
                          }
                        }
                      } catch (e) {
                        console.error("Error fetching user stats:", e);
                      }
                    } else {
                      testState.isUserPremium = false;
                      testState.premiumPackage = "";
                      premiumGrantedAt = null;

                      // Redirect unauthenticated users trying to take a test to the auth page
                      if (!window.location.pathname.endsWith("/auth")) {
                        window.location.href = "auth";
                      }
                      return;
                    }

                    // --- Enforce "Already Completed" Block for URL Bypass ---
                    if (user) {
                      try {
                        const existingResult = await fetchUserMockTestResult(
                          user.uid,
                          currentTestId,
                        );
                        if (existingResult) {
                          testState.alreadyCompleted = true;
                        }
                      } catch (e) {
                        console.error("Error checking past results:", e);
                      }
                    }

                    if (testState.alreadyCompleted) {
                      testState.isCheckingAuth = false;
                      renderApp(); // Render the completed block screen
                      return; // STOP execution here
                    }

                    // --- Advanced Premium Access Check based on Package Tier ---
                    const moduleTests =
                      currentModuleId === "writing"
                        ? allWritingTests
                        : allMockTests.filter(
                            (t) => t.moduleId === currentModuleId,
                          );
                    const testIndex = moduleTests.findIndex(
                      (t) => t.id === currentTestId,
                    );

                    let allowedTests = 1; // Default Free Tier Access (1 Test)
                    if (testState.isUserPremium) {
                      const pkg = testState.premiumPackage || "";
                      if (
                        pkg.includes("Platinum") ||
                        pkg.includes("Full Premium")
                      )
                        allowedTests = 16;
                      else if (pkg.includes("Gold")) allowedTests = 11;
                      else if (pkg.includes("Silver")) allowedTests = 6;
                      else allowedTests = 16; // Legacy fallback
                    }

                    // If the user tries to access a test index beyond their allowed limit, block them
                    if (testIndex >= allowedTests) {
                      testState.accessDenied = true;
                      testState.isCheckingAuth = false;
                      renderApp(); // Render Locked Premium Screen
                      return; // STOP execution here
                    }

                    // Prevent resetting the test if already actively taking it (fixes token refresh bug)
                    if (isTestInitialized && !testState.accessDenied) {
                      return;
                    }

                    // Access Granted: Initialize test
                    isTestInitialized = true;
                    testState.accessDenied = false; // FIX: Reset state properly so it doesn't get stuck!
                    testState.testCompleted = false;
                    testState.userAnswers = {}; // Reset user answers
                    testState.passageStates = {}; // Reset passage states
                    testState.audioCurrentTime = 0; // Reset audio time
                    questionPaletteItems = []; // Reset palette items
                    highlightState = {
                      notes: {},
                      currentSelection: null,
                      highlightCounter: 0,
                    }; // Reset highlights and notes
                    testState.currentQuestionIndex = 0; // Reset for listening
                    testState.currentSectionIndex = 0; // Reset for reading/writing
                    testState.activeReadingTab = "questions"; // Default to questions tab for reading
                    testState.activeWritingTab = "instructions"; // Default to instructions tab for writing

                    if (currentModuleId === "writing") {
                      currentTest.sections.forEach((task) => {
                        testState.userAnswers[task.id] = ""; // Initialize writing task answers
                      });
                      totalQuestions = currentTest.sections.length; // Total tasks for writing
                    } else {
                      let currentPaletteNumber = 1;

                      currentTest.sections.forEach((section) => {
                        section.questionGroups.forEach((qGroup) => {
                          if (qGroup.questions && qGroup.questions.length > 0) {
                            if (
                              qGroup.type === "matching_headings" ||
                              qGroup.type === "true_false_not_given" ||
                              qGroup.type === "matching_items" ||
                              qGroup.type === "which_paragraph_contains" ||
                              qGroup.type === "matching_sentence_endings"
                            ) {
                              qGroup.questions.forEach((question) => {
                                testState.userAnswers[question.id] = "";
                                questionPaletteItems.push({
                                  paletteNumber: currentPaletteNumber,
                                  questionId: question.id,
                                  htmlElementId: `question-${question.questionNumber}`,
                                });
                                currentPaletteNumber++;
                              });
                            } else if (qGroup.type === "matching") {
                              qGroup.matchingItems.forEach((item) => {
                                const questionId = `q${item.number}`;
                                testState.userAnswers[questionId] = "";
                                questionPaletteItems.push({
                                  paletteNumber: currentPaletteNumber,
                                  questionId: questionId,
                                  htmlElementId: `question-${item.number}`,
                                });
                                currentPaletteNumber++;
                              });
                            } else if (
                              qGroup.type === "multiple_choice_multiple_answers"
                            ) {
                              qGroup.questions.forEach((question) => {
                                testState.userAnswers[question.id] = []; // Initialize as array
                                const questionNumberRange = String(
                                  question.questionNumber,
                                ).split("-");
                                if (questionNumberRange.length === 2) {
                                  const start = parseInt(
                                    questionNumberRange[0],
                                  );
                                  const end = parseInt(questionNumberRange[1]);
                                  const count = end - start + 1;
                                  for (let i = 0; i < count; i++) {
                                    questionPaletteItems.push({
                                      paletteNumber: currentPaletteNumber,
                                      questionId: question.id, // All parts point to the same question ID
                                      htmlElementId: `question-${question.questionNumber}`,
                                      isMultiAnswerPart: true,
                                      requiredAnswers: count,
                                    });
                                    currentPaletteNumber++;
                                  }
                                } else {
                                  // Fallback for single number (should not happen for this type but for safety)
                                  questionPaletteItems.push({
                                    paletteNumber: currentPaletteNumber,
                                    questionId: question.id,
                                    htmlElementId: `question-${question.questionNumber}`,
                                    isMultiAnswerPart: false, // Treat as a normal question
                                  });
                                  currentPaletteNumber++;
                                }
                              });
                            } else if (
                              qGroup.type === "table_fill_in_the_blank"
                            ) {
                              if (qGroup.questions[0].correctAnswer) {
                                for (const subQuestionId in qGroup.questions[0]
                                  .correctAnswer) {
                                  testState.userAnswers[subQuestionId] = "";
                                  questionPaletteItems.push({
                                    paletteNumber: currentPaletteNumber,
                                    questionId: subQuestionId,
                                    htmlElementId: `question-${qGroup.questions[0].questionNumber}`,
                                  });
                                  currentPaletteNumber++;
                                }
                              }
                            } else {
                              qGroup.questions.forEach((question) => {
                                if (
                                  question.type === "table_fill_in_the_blank"
                                ) {
                                  if (question.correctAnswer) {
                                    for (const subQuestionId in question.correctAnswer) {
                                      testState.userAnswers[subQuestionId] = "";
                                      questionPaletteItems.push({
                                        paletteNumber: currentPaletteNumber,
                                        questionId: subQuestionId,
                                        htmlElementId: `question-${question.questionNumber}`,
                                      });
                                      currentPaletteNumber++;
                                    }
                                  }
                                } else if (question.type === "flow_chart") {
                                  if (
                                    question.steps &&
                                    question.steps.length > 0
                                  ) {
                                    question.steps.forEach((step) => {
                                      if (
                                        step.questionNumber !== undefined &&
                                        step.questionNumber !== null &&
                                        step.questionNumber !== ""
                                      ) {
                                        const questionId = `q${step.questionNumber}`;
                                        testState.userAnswers[questionId] = "";
                                        questionPaletteItems.push({
                                          paletteNumber: currentPaletteNumber,
                                          questionId: questionId,
                                          htmlElementId: `question-${step.questionNumber}`,
                                        });
                                        currentPaletteNumber++;
                                      }
                                    });
                                  }
                                } else {
                                  testState.userAnswers[question.id] = "";
                                  questionPaletteItems.push({
                                    paletteNumber: currentPaletteNumber,
                                    questionId: question.id,
                                    htmlElementId: `question-${question.questionNumber}`,
                                  });
                                  currentPaletteNumber++;
                                }
                              });
                            }
                          }
                        });
                      });

                      // Clean up any "undefined" question IDs created by intermediate steps to perfectly align palette
                      questionPaletteItems = questionPaletteItems.filter(
                        function (item) {
                          return (
                            item.questionId &&
                            item.questionId.indexOf("undefined") === -1 &&
                            item.htmlElementId &&
                            item.htmlElementId.indexOf("undefined") === -1
                          );
                        },
                      );

                      // Smart Recalculation: Extract exact question numbers to prevent misalignment
                      let multiAnswerCounter = {};
                      questionPaletteItems.forEach(function (item, index) {
                        let extractedNum = null;

                        // 1. Try to extract from questionId (e.g., "q24" -> 24)
                        let qMatch = item.questionId.match(/^q(\d+)$/);
                        if (qMatch) extractedNum = parseInt(qMatch[1]);

                        // 2. Try to extract from htmlElementId (e.g., "question-24" -> 24)
                        if (extractedNum === null && item.htmlElementId) {
                          let hMatch = item.htmlElementId.match(
                            /question-(\d+)$/,
                          );
                          if (hMatch) extractedNum = parseInt(hMatch[1]);
                        }

                        // 3. Handle multi-answer ranges (e.g., "question-21-26")
                        if (extractedNum === null && item.htmlElementId) {
                          let rangeMatch = item.htmlElementId.match(
                            /question-(\d+)-(\d+)/,
                          );
                          if (rangeMatch) {
                            let start = parseInt(rangeMatch[1]);
                            if (!multiAnswerCounter[item.htmlElementId]) {
                              multiAnswerCounter[item.htmlElementId] = start;
                            }
                            extractedNum =
                              multiAnswerCounter[item.htmlElementId];
                            multiAnswerCounter[item.htmlElementId]++;
                          }
                        }

                        if (extractedNum !== null && !isNaN(extractedNum)) {
                          item.paletteNumber = extractedNum;
                        } else {
                          item.paletteNumber = index + 1; // Fallback
                        }
                      });

                      // Deduplicate and Sort
                      let uniqueMap = new Map();
                      questionPaletteItems.forEach(function (item) {
                        if (!uniqueMap.has(item.paletteNumber)) {
                          uniqueMap.set(item.paletteNumber, item);
                        }
                      });
                      questionPaletteItems = Array.from(uniqueMap.values());
                      questionPaletteItems.sort(function (a, b) {
                        return a.paletteNumber - b.paletteNumber;
                      });

                      currentPaletteNumber =
                        questionPaletteItems.length > 0
                          ? questionPaletteItems[
                              questionPaletteItems.length - 1
                            ].paletteNumber + 1
                          : 1;

                      // After populating questionPaletteItems from the test data:
                      // Ensure totalQuestions is always 40 for Listening and Reading,
                      // and pad questionPaletteItems if necessary.
                      if (
                        currentModuleId === "listening" ||
                        currentModuleId === "reading"
                      ) {
                        const expectedTotalQuestions = 40;
                        const actualParsedQuestions =
                          questionPaletteItems.length;

                        if (actualParsedQuestions < expectedTotalQuestions) {
                          console.warn(
                            `Warning: ${currentModuleId} test '${currentTestId}' has ${actualParsedQuestions} answerable questions in data. Padding to ${expectedTotalQuestions} for IELTS standard.`,
                          );
                          for (
                            let i = actualParsedQuestions;
                            i < expectedTotalQuestions;
                            i++
                          ) {
                            const dummyQuestionId = `dummy_q_${i + 1}`;
                            testState.userAnswers[dummyQuestionId] = ""; // Initialize dummy answer as unanswered
                            questionPaletteItems.push({
                              paletteNumber: i + 1,
                              questionId: dummyQuestionId,
                              htmlElementId: `dummy-question-${i + 1}`, // Dummy ID, won't be scrolled to
                            });
                          }
                        } else if (
                          actualParsedQuestions > expectedTotalQuestions
                        ) {
                          console.warn(
                            `Warning: ${currentModuleId} test '${currentTestId}' has ${actualParsedQuestions} answerable questions in data, which is more than the standard 40. This might affect scoring accuracy.`,
                          );
                          // If there are more than 40 actual questions, we'll still score out of 40,
                          // but the unanswered count will reflect the actual number of input fields.
                        }
                        totalQuestions = expectedTotalQuestions; // Force totalQuestions to 40 for scoring
                      } else {
                        // For other modules, totalQuestions is just the count of parsed questions
                        totalQuestions = questionPaletteItems.length;
                      }
                    }

                    // Enforce 32 minutes total for Writing module
                    if (currentModuleId === "writing") {
                      currentTest.duration = 32;
                    }

                    testState.timeLeft = currentTest.duration * 60;

                    // --- NEW: Load draft state if it exists ---
                    const savedDraft = sessionStorage.getItem(
                      `ielts_mahir_draft_${currentModuleId}_${currentTestId}`,
                    );
                    if (savedDraft) {
                      try {
                        const parsedDraft = JSON.parse(savedDraft);
                        if (parsedDraft.userAnswers) {
                          testState.userAnswers = {
                            ...testState.userAnswers,
                            ...parsedDraft.userAnswers,
                          };
                        }
                        if (parsedDraft.timeLeft !== undefined) {
                          testState.timeLeft = parsedDraft.timeLeft;
                        }
                        if (parsedDraft.currentSectionIndex !== undefined) {
                          testState.currentSectionIndex =
                            parsedDraft.currentSectionIndex;
                        }
                        if (parsedDraft.passageStates) {
                          testState.passageStates = parsedDraft.passageStates;
                        }
                        if (parsedDraft.highlightNotes) {
                          highlightState.notes = parsedDraft.highlightNotes;
                        }
                        if (parsedDraft.highlightCounter !== undefined) {
                          highlightState.highlightCounter =
                            parsedDraft.highlightCounter;
                        }
                        if (parsedDraft.audioCurrentTime !== undefined) {
                          testState.audioCurrentTime =
                            parsedDraft.audioCurrentTime;
                        }
                        console.log("Draft state recovered successfully.");
                      } catch (e) {
                        console.error("Failed to parse draft state", e);
                      }
                    }
                    // --- END: Load draft state ---

                    console.log(
                      "Final total questions (for scoring):",
                      totalQuestions,
                    );
                    console.log(
                      "Question Palette Items (for UI/unanswered count):",
                      questionPaletteItems.length,
                    );

                    const audioPlayer = document.getElementById(
                      "test-audio-player",
                    );
                    if (audioPlayer && currentTest.audioUrl) {
                      audioPlayer.src = currentTest.audioUrl;

                      // --- IELTS Listening Audio Rules ---
                      if (currentModuleId === "listening") {
                        // The 'loadeddata' event ensures we can get the duration and play the audio.
                        audioPlayer.addEventListener("loadeddata", () => {
                          // Restore saved time if it exists
                          if (testState.audioCurrentTime > 0) {
                            audioPlayer.currentTime =
                              testState.audioCurrentTime;
                          }

                          // Auto-start the audio automatically without showing any prompts
                          const attemptAutoplay = () => {
                            let playPromise = audioPlayer.play();

                            if (playPromise !== undefined) {
                              playPromise.catch(() => {
                                // If the browser strictly blocks autoplay on a fresh load,
                                // it will silently wait for the user's first natural interaction (like scrolling or typing an answer) to unlock and play.
                                const silentUnlock = () => {
                                  audioPlayer.play().catch(() => {});
                                  [
                                    "click",
                                    "keydown",
                                    "touchstart",
                                    "scroll",
                                  ].forEach((evt) =>
                                    document.removeEventListener(
                                      evt,
                                      silentUnlock,
                                    ),
                                  );
                                };

                                [
                                  "click",
                                  "keydown",
                                  "touchstart",
                                  "scroll",
                                ].forEach((evt) =>
                                  document.addEventListener(evt, silentUnlock, {
                                    once: true,
                                  }),
                                );
                              });
                            }
                          };

                          attemptAutoplay();
                        });

                        // Initialize lastTime with the restored time to prevent the anti-seek from resetting it
                        let lastTime = testState.audioCurrentTime || 0;
                        // 1. Prevent pausing (added safe catch to prevent console spam)
                        audioPlayer.addEventListener("pause", () => {
                          // Silently resume if a pause is attempted before the audio ends.
                          if (!audioPlayer.ended) {
                            let forcePlay = audioPlayer.play();
                            if (forcePlay !== undefined) {
                              forcePlay.catch((e) => {
                                /* ignore */
                              });
                            }
                          }
                        });

                        // 1.5 Prevent changing playback speed (Force normal 1.0x speed)
                        audioPlayer.addEventListener("ratechange", () => {
                          if (audioPlayer.playbackRate !== 1.0) {
                            audioPlayer.playbackRate = 1.0;
                          }
                        });

                        // 2. Prevent seeking (rewinding and forwarding)
                        audioPlayer.addEventListener("timeupdate", () => {
                          // If the time jumps by more than 1 second, it's a seek attempt. Reset it.
                          // We check lastTime to avoid an issue on initial load.
                          if (
                            lastTime &&
                            Math.abs(audioPlayer.currentTime - lastTime) > 1
                          ) {
                            audioPlayer.currentTime = lastTime;
                          }
                          lastTime = audioPlayer.currentTime;
                          testState.audioCurrentTime = audioPlayer.currentTime; // Sync tracking continuously
                        });

                        // 3. Prevent replay after the audio has finished
                        audioPlayer.addEventListener("ended", () => {
                          // Silently do nothing. The timeupdate logic prevents seeking back to the start.
                        });
                      }
                      // --- End of IELTS Listening Audio Rules ---
                    }
                    testState.isCheckingAuth = false;
                    renderApp(); // Render actual test UI
                  });
                }
              } else {
                // Test not found
                appDiv.innerHTML = `
                        <div class="text-center text-red-500 text-xl mt-12">
                            Error: Mock test not found.
                            <br><a href="mock-test-home" class="text-blue-600 hover:underline mt-4 inline-block">Go back to mock tests</a>
                        </div>
                    `;
              }
            } else {
              // No module or test specified, redirect to home or show error
              appDiv.innerHTML = `
                    <div class="text-center text-red-500 text-xl mt-12">
                        Error: No module or test specified in the URL.
                        <br><a href="mock-test-home" class="text-blue-600 hover:underline mt-4 inline-block">Go back to mock tests</a>
                    </div>
                `;
            }
          })
          .catch((error) => {
            console.error("Failed to initialize Firebase in mock-test:", error);
            showToast(
              "Failed to initialize Firebase. Some features may not work.",
              "error",
            );
            // Even if Firebase fails, try to render the app, but features might be limited
            testState.isLoadingResults = false; // Ensure loading is off
            renderApp();
          });
      };
    </script>
  </body>
</html>
