        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(67, 56, 202, 0.03) 100%

    <script type="module">
      // Import authentication functions and state from the central auth.js file
      import {
        initFirebaseAuth,
        authAppState,
        showToast,
        Icons,
        signOutUser,
      } from "./auth.js";

      // Import quiz data and common styles
      import {
        quizCategories,
        allQuizTests,
        commonStyles,
        QuizIcons,
      } from "./quiz-test-data.js";

      // Firebase imports for Firestore
      import {
        getFirestore,
        doc,
        getDoc,
        collection,
        query,
        where,
        getDocs,
        setDoc,
      } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

      let db;
      let auth;

      // Mapping of category IDs to specific Font Awesome icons and Tailwind colors
      const categoryVisualsMap = {
        reading: { icon: "fas fa-book-reader", color: "bg-sky-600" },
        listening: { icon: "fas fa-headphones-alt", color: "bg-amber-600" },
        writing: { icon: "fas fa-pencil-alt", color: "bg-emerald-600" },
        speaking: { icon: "fas fa-microphone-alt", color: "bg-fuchsia-600" },
        grammar: { icon: "fas fa-language", color: "bg-indigo-600" },
        vocabulary: { icon: "fas fa-spell-check", color: "bg-violet-600" },
        general: { icon: "fas fa-star", color: "bg-blue-600" },
      };

      // Pagination state
      let currentPage = 1;
      const categoriesPerPage = 6;

      let userGameStats = {
        totalPoints: 0,
        level: 1,
        completedTests: [],
      };

      async function fetchUserGameStats(userId) {
        if (!db || !userId) return;
        const appId =
          typeof __app_id !== "undefined" ? __app_id : "default-app-id";
        const userStatsDocRef = doc(
          db,
          `artifacts/${appId}/users/${userId}/gameStats/summary`,
        );

        try {
          const docSnap = await getDoc(userStatsDocRef);
          if (docSnap.exists()) {
            userGameStats = { ...userGameStats, ...docSnap.data() };
          } else {
            // Optional: Save initial stats if none exist
            // await setDoc(userStatsDocRef, userGameStats);
          }
        } catch (error) {
          console.error("Error fetching user game stats:", error);
          showToast("Failed to load your game progress.", "error");
        }
      }

      function renderPaginationControls(totalPages) {
        if (totalPages <= 1) return "";

        let paginationHtml = `<div class="flex justify-center items-center gap-2 sm:gap-3 mt-12 font-outfit font-medium opacity-0 animate-fade-in-up" style="animation-delay: 0.5s;">`;

        paginationHtml += `<button id="prev-page-btn" class="flex items-center justify-center px-4 py-2 sm:px-5 sm:py-2.5 text-sm sm:text-base rounded-xl transition-all ${
          currentPage === 1
            ? "text-slate-400 bg-slate-100 cursor-not-allowed"
            : "text-slate-700 bg-white border border-slate-200 shadow-sm hover:border-indigo-300 hover:text-indigo-600 hover:shadow-md"
        }" ${currentPage === 1 ? "disabled" : ""}>
            <i class="fas fa-chevron-left mr-2 text-xs"></i> Prev
        </button>`;

        for (let i = 1; i <= totalPages; i++) {
          const isActive = currentPage === i;
          paginationHtml += `<button class="page-number-btn flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-xl transition-all ${
            isActive
              ? "bg-indigo-600 text-white font-bold shadow-md shadow-indigo-200 transform scale-105"
              : "bg-white text-slate-700 border border-slate-200 hover:border-indigo-300 hover:text-indigo-600 hover:shadow-md"
          }" data-page="${i}">
            ${i}
        </button>`;
        }

        paginationHtml += `<button id="next-page-btn" class="flex items-center justify-center px-4 py-2 sm:px-5 sm:py-2.5 text-sm sm:text-base rounded-xl transition-all ${
          currentPage === totalPages
            ? "text-slate-400 bg-slate-100 cursor-not-allowed"
            : "text-slate-700 bg-white border border-slate-200 shadow-sm hover:border-indigo-300 hover:text-indigo-600 hover:shadow-md"
        }" ${currentPage === totalPages ? "disabled" : ""}>
            Next <i class="fas fa-chevron-right ml-2 text-xs"></i>
        </button>`;

        paginationHtml += `</div>`;
        return paginationHtml;
      }

      function goToPage(pageNumber) {
        currentPage = pageNumber;
        renderApp();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function updateAuthUI(user) {
        const authButtonsContainer = document.getElementById(
          "auth-buttons-container",
        );
        if (authButtonsContainer) {
          if (user) {
            if (db && user.uid) {
              await fetchUserGameStats(user.uid);
            }

            const initial = (
              authAppState.userProfile?.name ||
              user.email ||
              user.uid
            )
              .charAt(0)
              .toUpperCase();
            const displayName =
              authAppState.userProfile?.name ||
              user.email ||
              user.uid.substring(0, 8);

            authButtonsContainer.innerHTML = `
                <div class="flex items-center gap-4 relative">
                    <!-- Points Badge (Keeping the gamification aspect visible) -->
                    <div class="hidden sm:flex items-center gap-1.5 px-4 py-1.5 bg-white border border-slate-200 rounded-full shadow-sm text-sm font-bold outfit-text text-slate-700">
                        <i class="fas fa-star text-amber-400"></i>
                        <span>${userGameStats.totalPoints} Pts | Lvl ${userGameStats.level}</span>
                    </div>
                    
                    <div class="relative">
                        <button id="profile-icon-btn" class="flex items-center justify-center w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-indigo-600 text-white text-lg font-bold shadow-md hover:shadow-lg hover:scale-105 transition-all border-2 border-white ring-2 ring-transparent focus:ring-indigo-100">
                            ${initial}
                        </button>
                        
                        <!-- Premium Dropdown -->
                        <div id="profile-dropdown" class="absolute right-0 mt-3 w-56 bg-white rounded-2xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.15)] border border-slate-100 py-2 z-50 hidden transform origin-top-right transition-all">
                            <div class="px-5 py-3 border-b border-slate-100">
                                <p class="text-sm font-bold outfit-text text-slate-800 truncate">${displayName}</p>
                                <p class="text-xs text-slate-500 mt-0.5 font-medium">Level ${userGameStats.level} Scholar</p>
                            </div>
                            <div class="py-1">
                                <a href="dashboard" class="flex items-center gap-3 px-5 py-2.5 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 transition-colors">
                                    <i class="fas fa-chart-line w-4 text-center"></i> Dashboard
                                </a>
                                <a href="ielts-mahir-community-forum" class="flex items-center gap-3 px-5 py-2.5 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 transition-colors">
                                    <i class="fas fa-users w-4 text-center"></i> Community
                                </a>
                            </div>
                            <div class="border-t border-slate-100 py-1">
                                <button id="sign-out-dropdown-btn" class="flex items-center gap-3 w-full text-left px-5 py-2.5 text-sm font-medium text-red-600 hover:bg-red-50 transition-colors">
                                    <i class="fas fa-sign-out-alt w-4 text-center"></i> Sign Out
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const profileIconBtn = document.getElementById("profile-icon-btn");
            const profileDropdown = document.getElementById("profile-dropdown");
            const signOutDropdownBtn = document.getElementById(
              "sign-out-dropdown-btn",
            );

            profileIconBtn.addEventListener("click", (event) => {
              event.stopPropagation();
              profileDropdown.classList.toggle("hidden");
            });

            document.addEventListener("click", (event) => {
              if (
                !profileDropdown.contains(event.target) &&
                !profileIconBtn.contains(event.target)
              ) {
                profileDropdown.classList.add("hidden");
              }
            });

            signOutDropdownBtn.addEventListener("click", async () => {
              await signOutUser();
            });

            authButtonsContainer.innerHTML = `

                    Join Beta
                </a>
            `;
          }

                                    <img src="https://images.unsplash.com/photo-1513258496099-48168024aec0?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" alt="Study materials" />

                    ${
                      currentCategories.length === 0
                        ? `

                        </div>
                    `
                        : ""
                    }
                </div>

                <!-- Pagination Controls -->
                ${renderPaginationControls(totalPages)}
            </main>
        `;

        // Attach event listeners for pagination buttons after rendering
        const prevBtn = document.getElementById("prev-page-btn");
        if (prevBtn) {
          prevBtn.onclick = () => goToPage(currentPage - 1);
        }

        const nextBtn = document.getElementById("next-page-btn");
        if (nextBtn) {
          nextBtn.onclick = () => goToPage(currentPage + 1);
        }

        document.querySelectorAll(".page-number-btn").forEach((button) => {
          button.onclick = (e) => goToPage(parseInt(e.target.dataset.page));
        });
      }

      // Initialization Logic
      window.onload = async function () {
        initFirebaseAuth(updateAuthUI)
          .then(({ db: firestoreDb, auth: firebaseAuth }) => {
            db = firestoreDb;
            auth = firebaseAuth;

            auth.onAuthStateChanged(async (user) => {
              if (user) {
                await fetchUserGameStats(user.uid);
              }
              // Always render the app so unauthenticated users can see the content
              renderApp();
            });
          })
          .catch((error) => {
            console.error("Failed to initialize Firebase:", error);
            showToast(
              "Initialization error. Some features may not work.",
              "error",
            );
            renderApp(); // Still render UI
          });
      };
    </script>
